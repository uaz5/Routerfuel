# =============================================================================
# docker-compose.yml — RouterFuel
#
# `docker compose up` gets you: Postgres with pgvector pre-installed,
# migrations run automatically on RouterFuel's first boot (sqlx::migrate! in
# main.rs), and the gateway listening on :3000. The app service pulls a
# prebuilt image, so this takes seconds rather than the 10-15 minutes a
# from-scratch Rust compile costs. To build from source instead, layer on
# docker-compose.build.yml (see that file).
#
# Semantic caching is ON out of the box: models/embedding.onnx and
# models/tokenizer.json are committed to this repo, so a plain `git clone`
# already has everything the embedder needs, and the `models` volume below
# mounts them into the container. Nothing to download or convert.
#
# It degrades gracefully rather than failing: if those files are missing or
# unreadable, embedder::load() logs a warning at startup and the gateway runs
# normally with semantic caching disabled (the exact-hash cache still
# applies — see src/semantic_cache.rs). Look for "Local ONNX embedding model
# loaded — semantic cache active" in the startup log to confirm it's on.
# =============================================================================

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: routerfuel
      POSTGRES_PASSWORD: routerfuel
      POSTGRES_DB: routerfuel
    volumes:
      - routerfuel_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routerfuel -d routerfuel"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: nayilumair/routerfuel:0.6.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://routerfuel:routerfuel@db:5432/routerfuel
      HOST: 0.0.0.0
      PORT: 3000

      # See env.example — copy it to .env and fill these in before running.
      # Both of these are now fallback/override layers only: the `client_tiers`
      # table is the live source of truth for keys and tiers, and the gateway
      # re-reads it on a timer, so neither var is required to provision a key.
      ROUTERFUEL_API_KEYS: ${ROUTERFUEL_API_KEYS:-}
      ROUTERFUEL_CLIENT_TIERS: ${ROUTERFUEL_CLIENT_TIERS:-}
      ROUTERFUEL_ADMIN_KEY: ${ROUTERFUEL_ADMIN_KEY:-}
      ENABLE_SHADOW_MODE: ${ENABLE_SHADOW_MODE:-true}

      # How often to re-read the client_tiers table, in seconds. Unset is
      # fine — main.rs falls back to client_registry::DEFAULT_SYNC_INTERVAL_SECS
      # (30). Lower it if you want new signups/tier upgrades to apply faster.
      ROUTERFUEL_CLIENT_SYNC_SECS: ${ROUTERFUEL_CLIENT_SYNC_SECS:-30}

      # Container-side paths for the model files the repo ships, mounted via
      # the `models` volume below. Override only if you're pointing at a
      # different embedding model — but note migration 005 fixes the vector
      # column's dimension, so a model with a different output size needs that
      # migration changed too (see src/semantic_cache.rs's
      # embedding_dims_matches_migration_005 test).
      EMBEDDING_MODEL_PATH: /app/models/embedding.onnx
      EMBEDDING_TOKENIZER_PATH: /app/models/tokenizer.json
    ports:
      - "3000:3000"
    volumes:
      # The ONNX sentence-embedding model + tokenizer that power semantic
      # caching. Both are committed to the repo, so this directory is already
      # populated after a clone — mounted read-only because the gateway only
      # ever reads them. Not baked into the image (see .dockerignore), which
      # is why running the image without compose leaves caching disabled.
      - ./models:/app/models:ro

volumes:
  routerfuel_pgdata:
